<!DOCTYPE html>
<html>
<head>
    <title>Pincket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; margin: 0; background: #100b20; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; background: #231245; border-right: 5px solid #ff007f; padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .profile-card { background: #100b20; border: 3px solid #00d4ff; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 4px 4px 0px #00d4ff; }
        
        #main-content { flex-grow: 1; padding: 40px; overflow-y: auto; text-align: center; background: radial-gradient(circle, #1b1448 0%, #100b20 100%); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: pop 0.2s ease-out; }
        @keyframes pop { 0% { transform: scale(0.98); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .btn { padding: 12px 20px; font-size: 16px; cursor: pointer; border: 3px solid #fff; border-radius: 8px; font-weight: 900; text-transform: uppercase; transition: 0.1s; background: #00d4ff; color: #100b20; box-shadow: 0px 4px 0px #0097b2; position: relative; top: 0; outline: none; }
        .btn:active { top: 4px; box-shadow: 0px 0px 0px transparent; }
        .btn-nav { width: 100%; margin-bottom: 5px; }
        .btn-answer { background: #ff007f; color: white; width: 100%; box-shadow: 0px 4px 0px #c20062; }
        
        .trivia-container { background: #231245; padding: 30px; border-radius: 20px; max-width: 500px; margin: 0 auto; border: 4px solid #00d4ff; box-shadow: 6px 6px 0px #ff007f; }
        .pack { background: #231245; border: 4px solid #ff007f; border-radius: 15px; padding: 20px; cursor: pointer; transition: 0.3s; display: inline-block; width: 140px; margin: 10px; }

        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: white; color: #100b20; padding: 40px; border-radius: 20px; width: 320px; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h1 style="font-weight:900; color:#ff007f; margin:0;">PINCKET</h1>
            <p style="color:#666; font-size:14px; margin-bottom:20px;">Cloud Login</p>
            <input type="email" id="email" placeholder="Email" class="auth-input">
            <input type="password" id="password" placeholder="Password" class="auth-input">
            <button class="btn btn-nav" onclick="handleAuth('login')">Login</button>
            <button class="btn" style="background:#eee; border:none; width:100%; margin-top:5px; box-shadow:none;" onclick="handleAuth('signup')">Create Account</button>
            <p id="auth-error" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div id="sidebar">
        <div class="profile-card">
            <div style="font-size: 40px;">👤</div>
            <div style="font-size: 24px; color: #ff007f; font-weight: 900;"><span id="tokenCount">0</span> 💰</div>
        </div>
        <button class="btn btn-nav" onclick="switchTab('home')">🏠 Home</button>
        <button class="btn btn-nav" onclick="switchTab('play')">🎮 Play Trivia</button>
        <button class="btn btn-nav" onclick="switchTab('market')">🛒 Market</button>
        <button class="btn btn-nav" onclick="switchTab('inventory')">🎒 Collection</button>
        <div style="flex-grow:1;"></div>
        <button class="btn" style="background:#ff4757; border:none; color:white; font-size:10px; box-shadow:none;" onclick="logout()">Logout</button>
    </div>

    <div id="main-content">
        <div id="homeTab" class="tab-content active">
            <h1 style="font-size:60px; text-shadow: 4px 4px #ff007f; margin-bottom:10px;">Welcome Back!</h1>
            <p style="font-size:22px; opacity:0.8; margin-bottom:40px;">Collect 'em all, one question at a time.</p>
            <button class="btn" style="padding: 25px 60px; font-size: 24px;" onclick="switchTab('play')">Start Playing</button>
        </div>

        <div id="playTab" class="tab-content">
            <div class="trivia-container">
                <div id="question-text" style="font-size:26px; font-weight:900; margin-bottom:20px;">Ready to Start?</div>
                <div id="answers-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:15px;"></div>
                <div id="trivia-feedback" style="margin-top:20px; font-weight:900; min-height:24px;"></div>
            </div>
        </div>

        <div id="marketTab" class="tab-content">
            <h2 style="font-size:32px;">The Market (100 💰)</h2>
            <div class="pack" onclick="buyPack('Anime')"><div style="font-size:40px;">🔥</div><h3>Anime</h3></div>
            <div class="pack" onclick="buyPack('Nintendo')"><div style="font-size:40px;">🍄</div><h3>Nintendo</h3></div>
        </div>

        <div id="inventoryTab" class="tab-content">
            <h2 style="font-size:32px;">Your Collection</h2>
            <div id="inventory-list" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3BQO2283K_FSIsu-oaxEAEH5lutv5AuA",
            authDomain: "pincket-database.firebaseapp.com",
            projectId: "pincket-database",
            storageBucket: "pincket-database.firebasestorage.app",
            messagingSenderId: "944436346969",
            appId: "1:944436346969:web:307b797544b451bec27148"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let userData = { tokens: 0, inventory: [] };

        // --- SYNTH AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNote(freq, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            correct: () => { playNote(523, 'square', 0.1); setTimeout(() => playNote(659, 'square', 0.2), 100); },
            wrong: () => { playNote(220, 'sawtooth', 0.1); setTimeout(() => playNote(110, 'sawtooth', 0.3), 100); },
            click: () => playNote(440, 'sine', 0.05),
            pack: () => { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => playNote(f, 'square', 0.2), i * 100)); }
        };

        // --- GLOBAL FUNCTIONS ---
        window.handleAuth = async (type) => {
            sounds.click();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                if (type === 'signup') {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), { tokens: 0, inventory: [] });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) { document.getElementById('auth-error').innerText = err.message; }
        };

        window.logout = () => { sounds.click(); signOut(auth); };

        window.switchTab = (t) => {
            sounds.click();
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(t + 'Tab').classList.add('active');
            if (t === 'play') window.loadQuestion(); 
        };

        window.buyPack = async (type) => {
            if(userData.tokens >= 100) {
                userData.tokens -= 100;
                sounds.pack();
                const pool = type === 'Anime' ? ["Goku", "Vegeta", "Naruto", "Luffy"] : ["Mario", "Kirby", "Link", "Pikachu"];
                const pull = pool[Math.floor(Math.random() * pool.length)];
                userData.inventory.push(pull);
                alert("NICE! You pulled: " + pull);
                await saveToCloud();
                updateUI();
            } else { sounds.wrong(); alert("Not enough tokens!"); }
        };

        // --- TRIVIA SYSTEM ---
        const trivia = [
            { q: "What is 11 x 11?", a: ["121", "111", "131", "122"], c: "121" },
            { q: "Capital of Texas?", a: ["Dallas", "Houston", "Austin", "San Antonio"], c: "Austin" },
            { q: "What is the boiling point of water?", a: ["90°C", "100°C", "110°C", "120°C"], c: "100°C" },
            { q: "Who painted the Mona Lisa?", a: ["Van Gogh", "Da Vinci", "Picasso", "Monet"], c: "Da Vinci" }
        ];

        window.loadQuestion = () => {
            const q = trivia[Math.floor(Math.random() * trivia.length)];
            document.getElementById('question-text').innerText = q.q;
            const grid = document.getElementById('answers-grid');
            grid.innerHTML = "";
            q.a.sort(() => Math.random() - 0.5).forEach(ans => {
                const b = document.createElement('button');
                b.className = "btn btn-answer";
                b.innerText = ans;
                b.onclick = async () => {
                    const fb = document.getElementById('trivia-feedback');
                    if(ans === q.c) {
                        userData.tokens += 100; sounds.correct();
                        fb.innerText = "CORRECT! +100 💰";
                        fb.style.color = "#00d4ff";
                    } else {
                        sounds.wrong();
                        fb.innerText = "WRONG! Try another...";
                        fb.style.color = "#ff007f";
                    }
                    await saveToCloud();
                    updateUI();
                    setTimeout(() => { fb.innerText = ""; window.loadQuestion(); }, 1200);
                };
                grid.appendChild(b);
            });
        };

        async function saveToCloud() {
            if(auth.currentUser) await updateDoc(doc(db, "users", auth.currentUser.uid), userData);
        }

        function updateUI() {
            document.getElementById('tokenCount').innerText = userData.tokens;
            const inv = Array.isArray(userData.inventory) ? userData.inventory : [];
            document.getElementById('inventory-list').innerHTML = inv.map(i => `
                <div class="pack" style="width:80px; padding:5px; border-width:2px;"><p style="font-size:10px; margin:0;">${i}</p></div>
            `).join('');
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-overlay').classList.add('hidden');
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    userData = docSnap.data();
                    if (!Array.isArray(userData.inventory)) userData.inventory = [];
                }
                updateUI();
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
