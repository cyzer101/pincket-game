<!DOCTYPE html>
<html>
<head>
    <title>Pincket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body { font-family: 'Nunito', sans-serif; margin: 0; background: #100b20; color: white; display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 260px; background: #231245; border-right: 5px solid #ff007f; padding: 20px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: 5px 0px 15px rgba(255, 0, 127, 0.2); z-index: 10;
        }

        h1 { margin: 0 0 10px 0; color: #00d4ff; text-align: center; text-shadow: 2px 2px #ff007f; font-size: 32px; letter-spacing: 2px; }

        .profile-card {
            background: #100b20; border: 3px solid #00d4ff; border-radius: 12px; padding: 15px;
            text-align: center; margin-bottom: 20px; box-shadow: 4px 4px 0px #00d4ff;
        }

        #avatar-display { width: 90px; height: 90px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.1); margin-bottom: 10px; }
        .stats { font-size: 22px; color: #ff007f; font-weight: 900; }

        #main-content { flex-grow: 1; padding: 40px; overflow-y: auto; text-align: center; }

        .btn { 
            padding: 12px 20px; font-size: 18px; cursor: pointer; color: #100b20; 
            border: 3px solid #fff; border-radius: 8px; font-family: 'Nunito', sans-serif;
            font-weight: 900; transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase;
            position: relative; top: 0;
        }
        .btn:active:not(:disabled) { box-shadow: 0px 0px 0px transparent !important; transform: translateY(4px); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-nav { background: #00d4ff; box-shadow: 0px 4px 0px #0097b2; margin-bottom: 5px; }
        .btn-anime { background: #ff9f43; box-shadow: 0px 4px 0px #d35400; margin: 10px; }
        .btn-nintendo { background: #ee5253; box-shadow: 0px 4px 0px #b33939; margin: 10px; }
        .btn-answer { background: #ff007f; color: white; box-shadow: 0px 4px 0px #c20062; margin: 5px; font-size: 16px; border: 3px solid #00d4ff;}
        
        .trivia-container { background: #231245; padding: 30px; border-radius: 12px; max-width: 600px; margin: 0 auto; border: 4px solid #00d4ff; box-shadow: 6px 6px 0px #ff007f; }
        #question-text { font-size: 24px; margin-bottom: 25px; min-height: 60px; line-height: 1.4; }
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #trivia-feedback { margin-top: 20px; font-weight: 900; font-size: 20px; min-height: 24px; }
        
        .pack-area { margin-top: 20px; }
        #result { margin-top: 30px; font-weight: bold; font-size: 26px; min-height: 250px; display: flex; flex-direction: column; align-items: center; }
        
        .flip-card { background-color: transparent; width: 160px; height: 220px; perspective: 1000px; cursor: pointer; margin-top: 10px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg) scale(1.1); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-direction: column; border: 4px solid white; box-sizing: border-box; box-shadow: 0px 10px 20px rgba(0,0,0,0.5); }
        .flip-card-front { background: repeating-linear-gradient(45deg, #ff007f, #ff007f 10px, #c20062 10px, #c20062 20px); color: white; font-size: 40px; font-weight: 900; text-shadow: 2px 2px #000; }
        .flip-card-back { background: #100b20; transform: rotateY(180deg); }
        .pull-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 5px; }
        
        #inventory-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .inv-item { background: #231245; border: 3px solid; border-radius: 10px; padding: 15px; width: 140px; text-align: center; position: relative; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); }
        .inv-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 5px; }
        .inv-count { background: #ff007f; color: white; border-radius: 20px; padding: 4px 10px; font-size: 14px; font-weight: 900; display: inline-block; margin: 5px 0 10px 0; border: 2px solid white;}
        .inv-rarity { font-size: 12px; text-transform: uppercase; font-weight: 900; margin-bottom: 5px; letter-spacing: 1px; }
        
        .btn-sell { background: #00d4ff; color: #100b20; border: 2px solid white; padding: 5px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 900; width: 100%; margin-bottom: 5px; text-transform: uppercase; transition: transform 0.1s;}
        .btn-sell:active { transform: scale(0.9); }
        .btn-equip { background: #ff007f; color: white; border: 2px solid white; padding: 5px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 900; width: 100%; text-transform: uppercase; transition: transform 0.1s;}
        .btn-equip:active { transform: scale(0.9); }
        .equipped-badge { background: #2ecc71; color: white; border: 2px solid white; padding: 5px; border-radius: 5px; font-size: 12px; font-weight: 900; width: 100%; display: block; box-sizing: border-box; text-transform: uppercase;}
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>PINCKET</h1>
        <div class="profile-card">
            <img id="avatar-display" src="https://placehold.co/100x100/bdc3c7/black?text=?" alt="Avatar">
            <div class="stats"><span id="tokenCount">0</span> 💰</div>
        </div>
        <button class="btn btn-nav" onclick="switchTab('play')">🎮 Play</button>
        <button class="btn btn-nav" onclick="switchTab('market')">🛒 Market</button>
        <button class="btn btn-nav" onclick="switchTab('inventory')">🎒 Inventory</button>
    </div>

    <div id="main-content">
        <div id="playTab">
            <h2>Earn Tokens</h2>
            <div class="trivia-container">
                <div id="question-text">Loading question...</div>
                <div class="answers-grid" id="answers-grid"></div>
                <div id="trivia-feedback"></div>
            </div>
        </div>

        <div id="marketTab" style="display: none;">
            <h2>The Market</h2>
            <div class="pack-area">
                <p style="font-size: 20px;">Packs Cost 100 Tokens 💰</p>
                <button class="btn btn-anime" onclick="openPack('anime')">🟠 Anime Pack</button>
                <button class="btn btn-nintendo" onclick="openPack('nintendo')">🍄 Nintendo Pack</button>
                <div id="result"></div>
            </div>
        </div>

        <div id="inventoryTab" style="display: none;">
            <h2>Your Permanent Collection</h2>
            <div id="inventory-grid"></div>
        </div>
    </div>

    <script>
        let tokens = 0;
        let inventory = {}; 
        let equippedAvatar = "https://placehold.co/100x100/bdc3c7/black?text=?"; 
        let currentQuestionIndex = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function sfxClick() { playTone(600, 'sine', 0.1); }
        function sfxCorrect() { playTone(800, 'sine', 0.1); setTimeout(()=>playTone(1200, 'sine', 0.2), 100); }
        function sfxWrong() { playTone(300, 'sawtooth', 0.3); }
        function sfxCommon() { playTone(400, 'square', 0.2); }
        function sfxRare() { playTone(400, 'square', 0.1); setTimeout(()=>playTone(600, 'square', 0.2), 100); }
        function sfxEpic() { playTone(400, 'square', 0.1); setTimeout(()=>playTone(600, 'square', 0.1), 100); setTimeout(()=>playTone(800, 'square', 0.3), 200); }
        function sfxMystic() { [400, 500, 600, 800, 1000, 1200].forEach((f, i) => setTimeout(()=>playTone(f, 'square', 0.1), i*80)); }

        const packData = {
            anime: [
                { name: "UI Goku", rarity: "Mystic", color: "#ff007f", img: "https://placehold.co/100x100/ff007f/white?text=UI+Goku" },
                { name: "Majin Vegeta", rarity: "Epic", color: "#9b59b6", img: "https://placehold.co/100x100/9b59b6/white?text=Vegeta" },
                { name: "Piccolo", rarity: "Rare", color: "#00d4ff", img: "https://placehold.co/100x100/00d4ff/black?text=Piccolo" },
                { name: "Yamcha", rarity: "Common", color: "#bdc3c7", img: "https://placehold.co/100x100/bdc3c7/black?text=Yamcha" }
            ],
            nintendo: [
                { name: "Snorlax", rarity: "Mystic", color: "#ff007f", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png" },
                { name: "Charizard", rarity: "Epic", color: "#9b59b6", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" },
                { name: "Pikachu", rarity: "Rare", color: "#00d4ff", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" },
                { name: "Magikarp", rarity: "Common", color: "#bdc3c7", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/129.png" }
            ]
        };

        // --- EXPANDED TRIVIA WITH "SNEAKY LEARNING" ---
        const triviaQuestions = [
            // Pop Culture
            { question: "In Dragon Ball Z, what is the name of Goku's signature energy attack?", answers: ["Galick Gun", "Kamehameha", "Special Beam Cannon", "Spirit Bomb"], correctAnswer: "Kamehameha" },
            { question: "Which of these characters is known for sleeping and blocking paths?", answers: ["Pikachu", "Snorlax", "Jigglypuff", "Charizard"], correctAnswer: "Snorlax" },
            { question: "What classic item heals Kirby completely?", answers: ["Super Mushroom", "Maxim Tomato", "Star Rod", "Warp Star"], correctAnswer: "Maxim Tomato" },
            // Math
            { question: "What is 7 multiplied by 8?", answers: ["54", "56", "64", "62"], correctAnswer: "56" },
            { question: "If a triangle has a 90-degree angle, what kind of triangle is it?", answers: ["Acute", "Obtuse", "Right", "Equilateral"], correctAnswer: "Right" },
            { question: "What is half of 250?", answers: ["100", "125", "150", "175"], correctAnswer: "125" },
            // History
            { question: "Who was the first President of the United States?", answers: ["Abraham Lincoln", "Thomas Jefferson", "George Washington", "John Adams"], correctAnswer: "George Washington" },
            { question: "In what year did the Apollo 11 moon landing take place?", answers: ["1965", "1969", "1972", "1959"], correctAnswer: "1969" },
            // Science
            { question: "What planet is known as the Red Planet?", answers: ["Venus", "Jupiter", "Mars", "Saturn"], correctAnswer: "Mars" },
            { question: "What is the hardest natural substance on Earth?", answers: ["Gold", "Iron", "Diamond", "Quartz"], correctAnswer: "Diamond" },
            { question: "What gas do plants absorb from the atmosphere?", answers: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], correctAnswer: "Carbon Dioxide" }
        ];

        const resultDiv = document.getElementById('result');
        const tokenDisplay = document.getElementById('tokenCount');
        const avatarDisplay = document.getElementById('avatar-display');
        const playTab = document.getElementById('playTab');
        const marketTab = document.getElementById('marketTab');
        const invTab = document.getElementById('inventoryTab');
        const invGrid = document.getElementById('inventory-grid');
        const questionText = document.getElementById('question-text');
        const answersGrid = document.getElementById('answers-grid');
        const feedbackText = document.getElementById('trivia-feedback');

        function loadGame() {
            let savedData = localStorage.getItem("pincketSave");
            if (savedData) {
                let parsedData = JSON.parse(savedData);
                tokens = parsedData.tokens || 0;
                inventory = parsedData.inventory || {};
                equippedAvatar = parsedData.equippedAvatar || "https://placehold.co/100x100/bdc3c7/black?text=?";
            }
            updateDisplay();
        }

        function saveGame() {
            localStorage.setItem("pincketSave", JSON.stringify({ tokens: tokens, inventory: inventory, equippedAvatar: equippedAvatar }));
        }

        function loadQuestion() {
            currentQuestionIndex = Math.floor(Math.random() * triviaQuestions.length);
            let q = triviaQuestions[currentQuestionIndex];
            questionText.innerText = q.question;
            answersGrid.innerHTML = ""; feedbackText.innerText = ""; 

            // Shuffle answers so the correct one isn't always in the same spot
            let shuffledAnswers = q.answers.sort(() => Math.random() - 0.5);

            shuffledAnswers.forEach(answer => {
                let btn = document.createElement('button');
                btn.className = 'btn btn-answer'; btn.innerText = answer;
                btn.onclick = () => checkAnswer(answer, q.correctAnswer);
                answersGrid.appendChild(btn);
            });
        }

        // --- UPDATED AUTO-SKIP LOGIC ---
        function checkAnswer(selected, correct) {
            // Disable all buttons to prevent spam clicking
            let answerBtns = document.querySelectorAll('.btn-answer');
            answerBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                sfxCorrect(); 
                tokens += 100; updateDisplay(); saveGame(); 
                feedbackText.innerText = "Correct! +100 Tokens 💰"; feedbackText.style.color = "#00d4ff";
            } else {
                sfxWrong(); 
                // Show them what the right answer actually was
                feedbackText.innerText = "Incorrect! The answer was " + correct + "."; feedbackText.style.color = "#ff007f";
            }
            
            // Skip to the next question automatically after 1.5 seconds
            setTimeout(loadQuestion, 1500); 
        }

        function switchTab(tab) {
            sfxClick(); 
            playTab.style.display = 'none'; marketTab.style.display = 'none'; invTab.style.display = 'none';
            if (tab === 'play') playTab.style.display = 'block';
            if (tab === 'market') marketTab.style.display = 'block';
            if (tab === 'inventory') { invTab.style.display = 'block'; renderInventory(); }
        }

        function addToInventory(item) {
            if (inventory[item.name]) { inventory[item.name].count++; } 
            else { inventory[item.name] = { img: item.img, color: item.color, rarity: item.rarity, count: 1 }; }
            saveGame(); 
        }

        function getSellPrice(rarity) {
            if (rarity === "Common") return 20; if (rarity === "Rare") return 60;   
            if (rarity === "Epic") return 150;  if (rarity === "Mystic") return 500; 
            return 0;
        }

        function sellItem(itemName) {
            sfxClick();
            if (inventory[itemName] && inventory[itemName].count > 0) {
                tokens += getSellPrice(inventory[itemName].rarity);
                inventory[itemName].count--;
                if (inventory[itemName].count === 0) {
                    if (equippedAvatar === inventory[itemName].img) equippedAvatar = "https://placehold.co/100x100/bdc3c7/black?text=?";
                    delete inventory[itemName];
                }
                updateDisplay(); saveGame(); renderInventory(); 
            }
        }

        function equip(itemName) {
            sfxClick(); equippedAvatar = inventory[itemName].img;
            updateDisplay(); saveGame(); renderInventory(); 
        }

        function openPack(packName) {
            sfxClick();
            if (tokens >= 100) {
                tokens -= 100; updateDisplay(); saveGame();
                
                let roll = Math.random() * 100;
                let rolledRarity = "Common";
                if (roll < 1) rolledRarity = "Mystic";
                else if (roll < 10) rolledRarity = "Epic";
                else if (roll < 30) rolledRarity = "Rare";

                let possibleDrops = packData[packName].filter(card => card.rarity === rolledRarity);
                let pulledItem = possibleDrops[Math.floor(Math.random() * possibleDrops.length)];

                addToInventory(pulledItem);
                
                resultDiv.innerHTML = `
                    <div class="flip-card" onclick="revealCard(this, '${pulledItem.rarity}', '${pulledItem.name}')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">?</div>
                            <div class="flip-card-back" style="border-color: ${pulledItem.color};">
                                <img src="${pulledItem.img}" class="pull-img">
                                <div style="color: ${pulledItem.color}; font-size: 16px; font-weight: 900;">${pulledItem.name}</div>
                                <div style="color: white; font-size: 12px; margin-top: 5px;">${pulledItem.rarity}</div>
                            </div>
                        </div>
                    </div>
                    <p id="reveal-text" style="margin-top: 15px; font-size: 16px; color: #00d4ff;">Click the pack to reveal!</p>
                `;
            } else {
                resultDiv.innerHTML = "Not enough tokens! Play trivia first."; resultDiv.style.color = "#ff007f";
            }
        }

        function revealCard(element, rarity, name) {
            if(element.classList.contains('flipped')) return; 
            
            element.classList.add('flipped');
            document.getElementById('reveal-text').innerText = "You pulled " + name + "!";
            
            if (rarity === "Common") sfxCommon();
            if (rarity === "Rare") sfxRare();
            if (rarity === "Epic") sfxEpic();
            if (rarity === "Mystic") sfxMystic();
        }

        function renderInventory() {
            invGrid.innerHTML = ""; 
            if (Object.keys(inventory).length === 0) {
                invGrid.innerHTML = "<p style='color: #888;'>Your inventory is empty. Go open some packs!</p>"; return;
            }
            for (let itemName in inventory) {
                let data = inventory[itemName];
                let itemBox = document.createElement('div');
                itemBox.className = 'inv-item'; itemBox.style.borderColor = data.color; 
                let isEquipped = (equippedAvatar === data.img);
                
                let cardHTML = `
                    <div class='inv-rarity' style='color: ${data.color};'>${data.rarity}</div>
                    <img src="${data.img}" class="inv-img">
                    <div style="font-weight: 900; color: white; font-size: 14px;">${itemName}</div>
                    <div class='inv-count'>x${data.count}</div><br>
                    <button class='btn-sell' onclick="sellItem('${itemName}')">Sell (+${getSellPrice(data.rarity)})</button>
                `;
                if (isEquipped) cardHTML += `<div class='equipped-badge'>✔️ Equipped</div>`;
                else cardHTML += `<button class='btn-equip' onclick="equip('${itemName}')">Equip</button>`;

                itemBox.innerHTML = cardHTML; invGrid.appendChild(itemBox);
            }
        }

        function updateDisplay() { tokenDisplay.innerText = tokens; avatarDisplay.src = equippedAvatar; }

        loadGame(); loadQuestion(); 
    </script>
</body>
</html>
