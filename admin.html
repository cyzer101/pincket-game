<!DOCTYPE html>
<html>
<head><title>Admin Upload</title></head>
<body style="background:#111; color:white; text-align:center; font-family:sans-serif;">
    <h1>Database Sync</h1>
    <input type="email" id="email" placeholder="Admin Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="sync()" style="padding:15px; margin:10px; cursor:pointer;">🚀 Sync All Data</button>
    <div id="status">Ready</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD3BQO2283K_FSIsu-oaxEAEH5lutv5AuA", authDomain: "pincket-database.firebaseapp.com", projectId: "pincket-database", storageBucket: "pincket-database.firebasestorage.app", messagingSenderId: "944436346969", appId: "1:944436346969:web:307b797544b451bec27148" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const cards = [
            { id: "goku", name: "Goku", packType: "Anime", rarity: 1, imageUrl: "https://upload.wikimedia.org/wikipedia/en/a/af/Son_Goku_YoungAdult.PNG" },
            { id: "naruto", name: "Naruto", packType: "Anime", rarity: 1, imageUrl: "https://upload.wikimedia.org/wikipedia/en/9/9a/NarutoUzuzmaki.png" },
            { id: "vegeta", name: "Vegeta", packType: "Anime", rarity: 2, imageUrl: "https://upload.wikimedia.org/wikipedia/en/f/f6/Vegeta_Dragon_Ball.jpg" },
            { id: "mario", name: "Mario", packType: "Nintendo", rarity: 1, imageUrl: "https://upload.wikimedia.org/wikipedia/en/a/a9/Mario_NSMBU.png" },
            { id: "kirby", name: "Kirby", packType: "Nintendo", rarity: 1, imageUrl: "https://upload.wikimedia.org/wikipedia/en/2/2d/Kirby_Cloud.png" }
        ];

        const questions = [
            { id: "q1", q: "What is 8 x 7?", a: ["54", "56", "64"], c: "56" },
            { id: "q2", q: "What planet is closest to the Sun?", a: ["Venus", "Mercury", "Mars"], c: "Mercury" }
        ];

        window.sync = async () => {
            const e = document.getElementById('email').value; const p = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
                for(const c of cards) { await setDoc(doc(db, "cards", c.id), c); }
                for(const q of questions) { await setDoc(doc(db, "questions", q.id), q); }
                document.getElementById('status').innerText = "✅ Database Synced!";
            } catch(err) { document.getElementById('status').innerText = "❌ Error: " + err.message; }
        };
    </script>
</body>
</html>
