<!DOCTYPE html>
<html>
<head><title>Admin Sync</title></head>
<body style="background:#111; color:white; text-align:center; font-family:sans-serif; padding: 50px;">
    <h1>Database Global Sync</h1>
    <div style="background:#222; padding:30px; border-radius:15px; display:inline-block;">
        <input type="email" id="email" placeholder="Admin Email" style="padding:10px; margin:5px;"><br>
        <input type="password" id="password" placeholder="Password" style="padding:10px; margin:5px;"><br>
        <button onclick="sync()" style="padding:15px 30px; margin:20px; cursor:pointer; background:#00d4ff; font-weight:bold; border:none; border-radius:8px;">🚀 Sync Stable Data</button>
        <div id="status">Status: Waiting...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyD3BQO2283K_FSIsu-oaxEAEH5lutv5AuA", authDomain: "pincket-database.firebaseapp.com", projectId: "pincket-database", storageBucket: "pincket-database.firebasestorage.app", messagingSenderId: "944436346969", appId: "1:944436346969:web:307b797544b451bec27148" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // STABLE IMAGE SOURCES
        const cards = [
            { id: "goku", name: "Goku", packType: "Anime", rarity: 1, imageUrl: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" }, // Placeholder for testing if block persists
            { id: "naruto", name: "Naruto", packType: "Anime", rarity: 1, imageUrl: "https://upload.wikimedia.org/wikipedia/en/9/9a/NarutoUzuzmaki.png" },
            { id: "vegeta", name: "Vegeta", packType: "Anime", rarity: 2, imageUrl: "https://upload.wikimedia.org/wikipedia/en/f/f6/Vegeta_Dragon_Ball.jpg" },
            { id: "mario", name: "Mario", packType: "Nintendo", rarity: 1, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/s/super-mario-odyssey-switch/hero" },
            { id: "kirby", name: "Kirby", packType: "Nintendo", rarity: 1, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/k/kirby-and-the-forgotten-land-switch/hero" }
        ];

        const questions = [
            { id: "math1", q: "What is 8 x 7?", a: ["54", "56", "64", "48"], c: "56" },
            { id: "math2", q: "What is 12 x 5?", a: ["50", "60", "70", "55"], c: "60" },
            { id: "sci1", q: "Which planet is closest to the Sun?", a: ["Venus", "Mars", "Mercury", "Earth"], c: "Mercury" }
        ];

        window.sync = async () => {
            const e = document.getElementById('email').value; const p = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
                for(const c of cards) { await setDoc(doc(db, "cards", c.id), c); }
                for(const q of questions) { await setDoc(doc(db, "questions", q.id), q); }
                document.getElementById('status').innerText = "✅ ALL DATA SYNCED!";
            } catch(err) { document.getElementById('status').innerText = "❌ ERROR: " + err.message; }
        };
    </script>
</body>
</html>
