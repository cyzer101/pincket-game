<!DOCTYPE html>
<html>
<head>
    <title>Pincket Admin: Card Uploader</title>
    <style>
        body { font-family: sans-serif; background: #111; color: white; padding: 40px; text-align: center; }
        .btn { background: #ff007f; color: white; padding: 15px 30px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #00d4ff; color: #111; }
        #status { margin-top: 20px; font-size: 18px; color: #00d4ff; }
    </style>
</head>
<body>

    <h1>Card Database Uploader</h1>
    <p>Click the button below to push the card list to Firestore.</p>
    
    <button class="btn" onclick="uploadCards()">🚀 Upload Cards to Cloud</button>
    
    <div id="status">Waiting...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your exact Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD3BQO2283K_FSIsu-oaxEAEH5lutv5AuA",
            authDomain: "pincket-database.firebaseapp.com",
            projectId: "pincket-database",
            storageBucket: "pincket-database.firebasestorage.app",
            messagingSenderId: "944436346969",
            appId: "1:944436346969:web:307b797544b451bec27148"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- THE MASTER CARD LIST ---
        // Rarity Key: 1 = Common, 2 = Rare, 3 = Ultra Rare
        const masterCardList = [
            // ANIME PACK
            { id: "anime_goku", name: "Goku", packType: "Anime", rarity: 1, imageUrl: "https://i.ebayimg.com/images/g/V~oAAOSwdXhkF34t/s-l1200.jpg" },
            { id: "anime_naruto", name: "Naruto Uzumaki", packType: "Anime", rarity: 1, imageUrl: "https://i.ebayimg.com/images/g/HpkAAOSwI~9kJG8Z/s-l1200.jpg" },
            { id: "anime_vegeta", name: "Vegeta", packType: "Anime", rarity: 2, imageUrl: "https://i.ebayimg.com/images/g/x6YAAOSwSZFkJQ8H/s-l1200.jpg" },
            { id: "anime_kakashi", name: "Kakashi Hatake", packType: "Anime", rarity: 2, imageUrl: "https://i.ebayimg.com/images/g/m4QAAOSw-K9kJG8a/s-l1200.jpg" },
            { id: "anime_ssj_goku", name: "Super Saiyan Goku", packType: "Anime", rarity: 3, imageUrl: "https://i.ebayimg.com/images/g/zX8AAOSw~jpkJG8c/s-l1200.jpg" }, // Ultra Rare!

            // NINTENDO PACK
            { id: "nin_mario", name: "Mario", packType: "Nintendo", rarity: 1, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/s/super-mario-odyssey-switch/hero" },
            { id: "nin_kirby", name: "Kirby", packType: "Nintendo", rarity: 1, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/k/kirby-and-the-forgotten-land-switch/hero" },
            { id: "nin_link", name: "Link", packType: "Nintendo", rarity: 2, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/t/the-legend-of-zelda-breath-of-the-wild-switch/hero" },
            { id: "nin_bowser", name: "Bowser", packType: "Nintendo", rarity: 2, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/s/super-mario-3d-world-plus-bowsers-fury-switch/hero" },
            { id: "nin_gold_mario", name: "Gold Mario", packType: "Nintendo", rarity: 3, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/m/mario-kart-8-deluxe-switch/hero" } // Ultra Rare!
        ];

        // --- THE UPLOAD FUNCTION ---
        window.uploadCards = async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Uploading... please wait.";
            
            try {
                let count = 0;
                for (const card of masterCardList) {
                    // We use the 'id' field as the document name so it doesn't create duplicates if you run it twice
                    await setDoc(doc(db, "cards", card.id), {
                        name: card.name,
                        packType: card.packType,
                        rarity: card.rarity,
                        imageUrl: card.imageUrl
                    });
                    count++;
                }
                statusDiv.innerText = `✅ Success! Uploaded ${count} cards to Firestore.`;
                statusDiv.style.color = "#00ff00";
            } catch (error) {
                statusDiv.innerText = `❌ Error: ${error.message}`;
                statusDiv.style.color = "red";
            }
        };
    </script>
</body>
</html>
