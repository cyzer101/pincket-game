<!DOCTYPE html>
<html>
<head>
    <title>Pincket Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #111; color: white; padding: 40px; text-align: center; }
        .btn { background: #00d4ff; color: #111; padding: 15px 30px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #ff007f; color: white; }
        input { padding: 12px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; width: 250px; text-align: center; }
        #status { margin-top: 20px; font-size: 18px; color: #ff007f; }
        .panel { background: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; border: 2px solid #444; }
    </style>
</head>
<body>

    <h1>Pincket Developer Upload</h1>
    
    <div class="panel">
        <p>Log in with your game account to authenticate.</p>
        <input type="email" id="email" placeholder="Your Game Email"><br>
        <input type="password" id="password" placeholder="Your Password"><br>
        
        <button class="btn" onclick="uploadData()">🚀 Push Game Data</button>
        <div id="status">Ready...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3BQO2283K_FSIsu-oaxEAEH5lutv5AuA",
            authDomain: "pincket-database.firebaseapp.com",
            projectId: "pincket-database",
            storageBucket: "pincket-database.firebasestorage.app",
            messagingSenderId: "944436346969",
            appId: "1:944436346969:web:307b797544b451bec27148"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 1. YOUR QUESTIONS
        const questionDeck = [
            { id: "q_math_1", q: "What is 8 x 7?", a: ["54", "56", "64", "48"], c: "56" },
            { id: "q_math_2", q: "What is 12 x 5?", a: ["50", "60", "70", "55"], c: "60" },
            { id: "q_math_3", q: "What is half of 150?", a: ["50", "75", "85", "100"], c: "75" },
            { id: "q_sci_1", q: "Which planet is closest to the Sun?", a: ["Venus", "Mars", "Mercury", "Earth"], c: "Mercury" },
            { id: "q_his_1", q: "In what year did the United States become a country?", a: ["1492", "1776", "1812", "1865"], c: "1776" },
            { id: "q_pop_1", q: "What is the name of Goku's signature blue energy attack?", a: ["Special Beam Cannon", "Kamehameha", "Final Flash", "Spirit Bomb"], c: "Kamehameha" },
            { id: "q_pop_2", q: "Which Pokémon is #001 in the Pokédex?", a: ["Pikachu", "Bulbasaur", "Charmander", "Squirtle"], c: "Bulbasaur" },
            { id: "q_pop_3", q: "What is the name of Link's legendary sword?", a: ["Excalibur", "Master Sword", "Zelda Blade", "Lightbringer"], c: "Master Sword" }
        ];

        // 2. YOUR CARDS
        const masterCardList = [
            { id: "anime_goku", name: "Goku", packType: "Anime", rarity: 1, imageUrl: "https://i.ebayimg.com/images/g/V~oAAOSwdXhkF34t/s-l1200.jpg" },
            { id: "anime_naruto", name: "Naruto", packType: "Anime", rarity: 1, imageUrl: "https://i.ebayimg.com/images/g/HpkAAOSwI~9kJG8Z/s-l1200.jpg" },
            { id: "anime_vegeta", name: "Vegeta", packType: "Anime", rarity: 2, imageUrl: "https://i.ebayimg.com/images/g/x6YAAOSwSZFkJQ8H/s-l1200.jpg" },
            { id: "nin_mario", name: "Mario", packType: "Nintendo", rarity: 1, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/s/super-mario-odyssey-switch/hero" },
            { id: "nin_kirby", name: "Kirby", packType: "Nintendo", rarity: 1, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/k/kirby-and-the-forgotten-land-switch/hero" },
            { id: "nin_link", name: "Link", packType: "Nintendo", rarity: 2, imageUrl: "https://assets.nintendo.com/image/upload/f_auto,q_auto,w_400/v1/ncom/en_US/games/switch/t/the-legend-of-zelda-breath-of-the-wild-switch/hero" },
            { id: "anime_ssj_goku", name: "SSJ Goku", packType: "Anime", rarity: 3, imageUrl: "https://i.ebayimg.com/images/g/zX8AAOSw~jpkJG8c/s-l1200.jpg" }
        ];

        window.uploadData = async () => {
            const statusDiv = document.getElementById('status');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                statusDiv.innerText = "❌ Please enter email & password.";
                return;
            }

            statusDiv.innerText = "Authenticating & Uploading...";
            
            try {
                await signInWithEmailAndPassword(auth, email, password);

                let qCount = 0;
                for (const item of questionDeck) {
                    await setDoc(doc(db, "questions", item.id), { q: item.q, a: item.a, c: item.c });
                    qCount++;
                }

                let cCount = 0;
                for (const card of masterCardList) {
                    await setDoc(doc(db, "cards", card.id), card);
                    cCount++;
                }

                statusDiv.innerText = `✅ Success! Uploaded ${qCount} questions and ${cCount} cards.`;
                statusDiv.style.color = "#00ff00";
            } catch (error) {
                statusDiv.innerText = `❌ Error: ${error.message}`;
                statusDiv.style.color = "red";
            }
        };
    </script>
</body>
</html>
